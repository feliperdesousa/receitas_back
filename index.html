<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>
</head>
<body>
    <h1>Aprendendo Fetch</h1>
    <button onclick="renderizarUsuario()">Buscar</button> <br>

    <input type="text" id="nome" placeholder="Digite o seu nome"> <br>
    <input type="text" id="email" placeholder="Digite o seu email"><br>
    <input type="text" id="senha" placeholder="Digite a sua senha"><br>

    <button onclick="cadastrarUsuario()">Salvar</button>

    <br><br>

    <div id="listar_usuarios"></div>


    <script>
        async function buscarUsuario() {
            const usuarios = await fetch('http://localhost:3000/usuarios');
            const resultado = await usuarios.json();
            return resultado;
        };

        async function renderizarUsuario() {
            const usuarios = await buscarUsuario();
            const div = document.getElementById('listar_usuarios')
            usuarios.forEach(usuario => {
                const card = document.createElement('div');
                card.style.border = '1px solid black';
                card.innerHTML = `<h1>${usuario.nome}</h1>`;
                div.appendChild(card);
            });
        };

        renderizarUsuario()


        async function cadastrarUsuario() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            if (!nome || !email || !senha) {
                alert("Preencha todos as informações!");
                return
            };

            await fetch('http://localhost:3000/usuarios', {
                method: "POST",
                body: JSON.stringify({nome, email, senha}),
                headers: {"Content-type": "application/json"}
            })
        };


    </script>
</body>
</html>
