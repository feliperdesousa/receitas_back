<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>
</head>
<body>
    <h1>Aprendendo Fetch</h1>
    <button onclick="buscarUsuario()">Buscar</button>

    <input type="text" id="nome" placeholder="Digite o seu nome">
    <input type="text" id="email" placeholder="Digite o seu email">
    <input type="text" id="senha" placeholder="Digite a sua senha">

    <button onclick="cadastrarUsuario()">Salvar</button>


    <script>
        async function buscarUsuario() {
            const usuarios = await fetch('http://localhost:3000/usuarios');
            const resultado = await usuarios.json();
            console.log(resultado);
        };

        buscarUsuario()

        async function cadastrarUsuario() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            if (!nome || !email || !senha) {
                alert("Preencha todos as informações!");
                return
            };

            await fetch('http://localhost:3000/usuarios', {
                method: "POST",
                body: JSON.stringify({nome, email, senha}),
                headers: {"Content-type": "application/json"}
            })
        };


    </script>
</body>
</html>
